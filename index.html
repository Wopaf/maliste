<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Films & Séries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="sticky-top">
  <header>
    <div class="controls">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Rechercher..." autocomplete="off" />
      <button class="search-clear" id="search-clear" aria-label="Effacer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="f-bar">
      <nav class="tabs">
        <button class="tab active" data-tab="films">
          <span class="tab-label">Films</span>
          <span class="tab-icon"><svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="m160-800 65 130q7 14 20 22t28 8q30 0 46-25.5t2-52.5l-41-82h80l65 130q7 14 20 22t28 8q30 0 46-25.5t2-52.5l-41-82h80l65 130q7 14 20 22t28 8q30 0 46-25.5t2-52.5l-41-82h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Zm0 0v320-320Z"/></svg></span>
        </button>
        <button class="tab" data-tab="series">
          <span class="tab-label">Séries</span>
          <span class="tab-icon"><svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M400-200v-80H160q-33 0-56.5-23.5T80-360v-400q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v400q0 33-23.5 56.5T800-280H560v80h40q17 0 28.5 11.5T640-160q0 17-11.5 28.5T600-120H360q-17 0-28.5-11.5T320-160q0-17 11.5-28.5T360-200h40ZM160-360h640v-400H160v400Zm0 0v-400 400Z"/></svg></span>
        </button>
        <button class="tab" data-tab="anime">
          <span class="tab-label">Animés</span>
          <span class="tab-icon"><svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M200-120q-17 0-28.5-11.5T160-160v-97q0-16 6-30.5t17-25.5l504-503q12-12 27-18t30-6q16 0 30.5 6t25.5 18l56 56q12 11 18 25.5t6 30.5q0 15-6 30t-18 27L353-143q-11 11-25.5 17t-30.5 6h-97Zm40-80h56l393-392-28-29-29-28-392 393v56Zm560-503-57-57 57 57Zm-139 82-29-28 57 57-28-29ZM560-120q74 0 137-37t63-103q0-32-16-55.5T702-359q-14-10-30-10t-27 12q-11 12-11 29.5t14 27.5q14 11 23 20t9 20q0 23-36.5 41.5T560-200q-17 0-28.5 11.5T520-160q0 17 11.5 28.5T560-120ZM360-720q0 14-17.5 25.5T262-654q-80 35-111 63.5T120-520q0 26 12 46t31 35q13 11 29 9.5t27-14.5q11-13 10-29t-14-27q-7-5-11-10t-4-10q0-12 18-24t76-37q88-38 117-69t29-70q0-55-44-87.5T280-840q-45 0-80.5 16T145-785q-11 13-9 29t15 26q13 11 29 9t27-13q14-14 31-20t42-6q41 0 60.5 12t19.5 28Z"/></svg></span>
        </button>
      </nav>
      <button class="f-bar-toggle" id="f-bar-toggle">
        <svg class="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <svg class="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
      </button>
      <div class="f-bar-controls" id="f-bar-controls">
      <div class="dropdown" id="sort-dropdown">
        <button class="dropdown-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor"><path d="M160-240q-17 0-28.5-11.5T120-280q0-17 11.5-28.5T160-320h160q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240H160Zm0-200q-17 0-28.5-11.5T120-480q0-17 11.5-28.5T160-520h400q17 0 28.5 11.5T600-480q0 17-11.5 28.5T560-440H160Zm0-200q-17 0-28.5-11.5T120-680q0-17 11.5-28.5T160-720h640q17 0 28.5 11.5T840-680q0 17-11.5 28.5T800-640H160Z"/></svg>
          <span class="dropdown-label">A → Z</span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <ul class="dropdown-list">
          <li class="dropdown-item active" data-value="alpha-asc">A → Z</li>
          <li class="dropdown-item" data-value="alpha-desc">Z → A</li>
          <li class="dropdown-item" data-value="year-desc">Récent</li>
          <li class="dropdown-item" data-value="year-asc">Ancien</li>
          <li class="dropdown-item" data-value="stars-desc">Mieux notés</li>
          <li class="dropdown-item" data-value="stars-asc">Moins notés</li>
        </ul>
      </div>
      <div class="dropdown" id="genre-dropdown">
        <button class="dropdown-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor"><path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z"/></svg>
          <span class="dropdown-label">Tous</span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <ul class="dropdown-list"></ul>
      </div>
<button id="layout-toggle" class="layout-toggle" title="Vue compacte">
        <svg class="icon-normal" width="15" height="15" viewBox="0 0 15 15" fill="currentColor">
          <rect x="0" y="0" width="4" height="15" rx="1"/>
          <rect x="5.5" y="0" width="4" height="15" rx="1"/>
          <rect x="11" y="0" width="4" height="15" rx="1"/>
        </svg>
        <svg class="icon-compact" width="15" height="15" viewBox="0 0 15 15" fill="currentColor">
          <rect x="0" y="0" width="15" height="4" rx="1"/>
          <rect x="0" y="5.5" width="15" height="4" rx="1"/>
          <rect x="0" y="11" width="15" height="4" rx="1"/>
        </svg>
      </button>
      </div>
    </div>
    </div>
  </header>

  <div class="grid-info">
    <span id="result-count" class="badge"></span>
    <span id="time-count" class="badge"></span>
  </div>
  </div>

  <main id="grid" class="grid"></main>

  <div class="grid-info-right">
    <button class="badge badge-btn" id="top-real-btn">Top Réal.</button>
    <button class="badge badge-btn" id="top-cast-btn">Top Cast.</button>
  </div>
  <div class="top-popup" id="top-popup">
    <p class="top-popup-title" id="top-popup-title"></p>
    <ul class="top-popup-list" id="top-popup-list"></ul>
  </div>

  <div id="modal-backdrop" class="modal-backdrop"></div>
  <div class="modal-card" id="modal-card">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-info">
      <div class="modal-meta">
        <p class="modal-title" id="modal-title"></p>
        <div class="modal-year-row">
          <p class="modal-year" id="modal-year"></p>
          <div class="modal-stars" id="modal-stars">
            <span class="star" data-value="1"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="3"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
            <span class="star" data-value="2"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="3"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
            <span class="star" data-value="3"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="3"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
            <span class="star star-caca" data-value="-1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-1.1 0-2 .9-2 2 0 .6.3 1.1.7 1.5C8.7 6.3 7.5 7.9 7.5 9.8c0 .4.1.8.2 1.2C5.9 11.8 5 13.3 5 15c0 2.8 2.2 5 5 5h8c2.8 0 5-2.2 5-5 0-1.7-.9-3.2-2.7-3.9.1-.4.2-.8.2-1.2 0-1.9-1.2-3.5-3.2-4.3.4-.4.7-.9.7-1.5 0-1.1-.9-2-2-2z"/></svg></span>
          </div>
        </div>
        <hr class="modal-divider">
        <p class="modal-director" id="modal-director"></p>
        <p class="modal-cast" id="modal-cast"></p>
        <p class="modal-series-info" id="modal-series-info"></p>
      </div>
      <div class="modal-actions">
        <a class="modal-link" id="modal-link" target="_blank" rel="noopener noreferrer">Informations</a>
        <a class="modal-link modal-link-secondary" id="modal-trailer" target="_blank" rel="noopener noreferrer">Bande annonce</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
