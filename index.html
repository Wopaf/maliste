<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Films & Séries</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="controls">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Rechercher..." autocomplete="off" />
    </div>
    <div class="f-bar">
      <nav class="tabs">
        <button class="tab active" data-tab="films">Films</button>
        <button class="tab" data-tab="series">Séries</button>
      </nav>
      <div class="dropdown" id="sort-dropdown">
        <button class="dropdown-toggle">
          <span class="dropdown-label">A → Z</span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <ul class="dropdown-list">
          <li class="dropdown-item active" data-value="alpha-asc">A → Z</li>
          <li class="dropdown-item" data-value="alpha-desc">Z → A</li>
        </ul>
      </div>
      <div class="dropdown" id="genre-dropdown">
        <button class="dropdown-toggle">
          <span class="dropdown-label">Tous</span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <ul class="dropdown-list"></ul>
      </div>
    </div>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <script src="script.js"></script>
</body>
</html>
